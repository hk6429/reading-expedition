<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="《萬卷浮城：梁山閱征記》讓國中生每天用十分鐘讀懂一件事，把知識建成自己的城市。"
    />
    <title>萬卷浮城｜梁山閱征記</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳至主要內容</a>
    <div id="app">
      <header class="site-header" aria-label="網站標題">
        <a class="brand-lockup" href="#/" aria-label="萬卷浮城首頁">
          <span class="eyebrow">梁山閱征記</span>
          <span class="wordmark">萬卷浮城</span>
        </a>
        <nav class="site-nav" aria-label="主要功能">
          <a class="teacher-entry" href="#/city" aria-label="查看我的萬卷浮城">我的浮城</a>
          <a class="teacher-entry" href="#/guide" aria-label="師生使用說明">使用說明</a>
          <a class="teacher-entry" href="#/class" aria-label="學生加入班級">學生加入</a>
          <a class="teacher-entry" href="#/teacher" aria-label="教師登入與管理">教師登入</a>
        </nav>
      </header>
      <main id="main-content">
        <section class="paper-panel" aria-labelledby="welcome-title">
          <p class="chapter-label">第一回・墨海來潮</p>
          <h1 id="welcome-title">每天十分鐘，讀懂一件事</h1>
          <p>
            從世界、科學與人文三條航線選一篇，把可信的知識帶回來，逐步修築你的萬卷浮城。
          </p>
          <p class="privacy-note">
            個人閱讀歷程與城市保存在這部裝置；第一版不收姓名、學號、Email、學校或班級真名。
          </p>
        </section>
      </main>
    </div>
    <noscript>
      《萬卷浮城》需要 JavaScript 才能保存閱讀進度。你仍可以先記住今天的約定：每天十分鐘，讀懂一件事。
    </noscript>
    <script>
      if (!["localhost", "127.0.0.1"].includes(window.location.hostname)) {
        const counterScript = document.createElement("script");
        counterScript.src =
          "https://self-learning-orbit.pages.dev/platform-counter.js";
        counterScript.dataset.site = "reading-expedition";
        counterScript.addEventListener("load", () => {
          const counter = document.getElementById("danai-public-counter");
          if (
            counter &&
            document.documentElement.dataset.publicCounter === "hide"
          ) {
            counter.style.display = "none";
          }
        });
        document.body.append(counterScript);
      }
    </script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
