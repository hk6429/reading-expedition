    <a class="skip-link" href="#main-content">跳至主要內容</a>

          <span class="eyebrow">梁山閱征記</span>
          <span class="wordmark">萬卷浮城</span>
        </a>
        <nav class="site-nav" aria-label="主要功能">
          <a class="teacher-entry" href="#/city" aria-label="查看我的萬卷浮城">我的浮城</a>
          <a class="teacher-entry" href="#/bookshelf" aria-label="查看目前階段全部選文">選文書架</a>
          <a class="teacher-entry" href="#/placement" aria-label="進行五分鐘閱讀程度測讀">程度測讀</a>
          <details class="more-nav">
            <summary>更多</summary>
            <div>
              <a class="teacher-entry" href="#/family" aria-label="家庭護照與跨裝置紀錄">家庭護照</a>
              <a class="teacher-entry" href="#/guide" aria-label="師生使用說明">使用說明</a>
              <a class="teacher-entry" href="#/class" aria-label="加入班級">加入班級</a>

        <p id="family-sync-chip" class="family-sync-chip" role="status" aria-live="polite" hidden></p>
      </header>
      <main id="main-content">
        <section class="paper-panel" aria-labelledby="welcome-title">
          <p class="chapter-label">第一回・墨海來潮</p>
          <h1 id="welcome-title">一次一篇，讀懂再往前</h1>
          <p>
            系統依個人進度接續文章；答題達標後，再選擇下一篇挑戰或今天先休息。
          </p>
          <p class="privacy-note">
            不登入也能完整試讀，個人歷程預設只存在這部裝置；選配家庭護照後，才會同步孩子代號、閱讀診斷與浮城進度。系統不收姓名、學號、Email、學校或班級真名。
          </p>
        </section>
      </main>
    </div>
    <noscript>
      《萬卷浮城》需要 JavaScript 才能保存個人閱讀與答題進度。你仍可以先記住約定：一次一篇，讀懂再往前。
    </noscript>
    <script>
      {
        const anonymousStatisticsKey =
          "reading-expedition.anonymous-statistics";
        const counterSelector =
          'script[data-site="reading-expedition"][src*="platform-counter.js"]';
        const isLocal =
          ["localhost", "127.0.0.1"].includes(window.location.hostname);

        function removePublicCounter() {
          document.querySelector(counterSelector)?.remove();
          document.getElementById("danai-public-counter")?.remove();
        }

        function loadPublicCounter() {
          if (
            isLocal ||
            window.localStorage.getItem(anonymousStatisticsKey) === "off" ||
            document.querySelector(counterSelector)
          ) {
            return;
          }
          const counterScript = document.createElement("script");
          counterScript.src =
            "https://self-learning-orbit.pages.dev/platform-counter.js";
          counterScript.dataset.site = "reading-expedition";
          counterScript.addEventListener("load", () => {
            const counter = document.getElementById("danai-public-counter");
            if (
              counter &&
              document.documentElement.dataset.publicCounter === "hide"
            ) {
              counter.style.display = "none";
            }
          });
          document.body.append(counterScript);
        }

        window.readingExpeditionPublicCounter = Object.freeze({
          load: loadPublicCounter,
          remove: removePublicCounter,
        });
        loadPublicCounter();
      }
    </script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
