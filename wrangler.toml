name = "reading-expedition-api"
main = "worker/src/index.js"
compatibility_date = "2026-07-28"
workers_dev = true

[vars]
GENERATION_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
GENERATION_MAX_RETRIES = "2"

[ai]
binding = "AI"

[triggers]
crons = ["0 21 * * *"]

[[d1_databases]]
binding = "READING_DB"
database_name = "reading-expedition"
database_id = "ff4023c1-eee7-4466-9dd7-219cae1e4851"
migrations_dir = "migrations"

[env.preview]
name = "reading-expedition-api-preview"
workers_dev = true

[env.preview.vars]
GENERATION_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
GENERATION_MAX_RETRIES = "2"

[env.preview.ai]
binding = "AI"

[env.preview.triggers]
crons = []

[[env.preview.d1_databases]]
binding = "READING_DB"
database_name = "reading-expedition-preview"
database_id = "f242c594-5932-4d91-9c0e-f788dfcb5c75"
migrations_dir = "migrations"
