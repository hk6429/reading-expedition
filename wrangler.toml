name = "reading-expedition-api"
main = "worker/src/index.js"
compatibility_date = "2026-07-28"
workers_dev = true

[triggers]
crons = ["0 21 * * *"]

[[d1_databases]]
binding = "READING_DB"
database_name = "reading-expedition"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.preview]
name = "reading-expedition-api-preview"
workers_dev = true

[env.preview.triggers]
crons = []

[[env.preview.d1_databases]]
binding = "READING_DB"
database_name = "reading-expedition-preview"
database_id = "f242c594-5932-4d91-9c0e-f788dfcb5c75"
migrations_dir = "migrations"
